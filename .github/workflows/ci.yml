# Continuous Integration for Cello
# Runs on every push and pull request to main branch
# Builds for multiple platforms: Linux (x86_64, aarch64), macOS (aarch64), Windows (x86_64, disabled)
# Pushing a `v*` tag also triggers a GitHub Release with the built wheels.

name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --check || echo "Formatting issues found (non-blocking)"

      - name: Run Clippy
        run: cargo clippy --all-targets || echo "Clippy warnings found (non-blocking)"

      # The `full` feature compiles the optional graphql/grpc deps; the regular
      # maturin build does not, so check it explicitly. Blocking: this is the
      # fastest place to catch dependency/feature compile errors.
      - name: Check all features (graphql + grpc)
        run: cargo check --features full

      # Rust unit tests (accept-key vectors, gRPC streaming, logging config...).
      # Non-blocking: pyo3 extension-module test binaries can fail to link on
      # some runners; `cargo clippy --all-targets` still typechecks them.
      - name: Run Rust unit tests
        run: cargo test --lib || echo "Rust unit test issues found (non-blocking)"

      - name: Install Python linters
        run: pip install ruff

      - name: Run Ruff
        run: ruff check python/ tests/ || echo "Ruff issues found (non-blocking)"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows test runner is disabled (see the commented build-windows
        # job below); wheels are still produced by the release job on tags.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio requests

      # Use maturin-action for proper build
      - name: Build and install wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Install built wheel
        shell: bash
        run: pip install dist/*.whl

      - name: Run Python tests
        run: pytest tests/ -v -k "not integration"

  # ============================================================================
  # Linux x86_64 Build
  # ============================================================================
  build-linux-x86:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels (manylinux)
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          args: --release --out dist
          manylinux: auto

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl

  # ============================================================================
  # Linux aarch64 Build (uses QEMU for cross-compilation)
  # ============================================================================
  build-linux-aarch64:
    name: Build Linux (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels (manylinux aarch64)
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-unknown-linux-gnu
          args: --release --out dist
          manylinux: 2_28

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-aarch64
          path: dist/*.whl

  # ============================================================================
  # macOS Build (aarch64 Apple Silicon only)
  # ============================================================================
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-apple-darwin
          args: --release --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-aarch64
          path: dist/*.whl

  # ============================================================================
  # Windows Builds (x86_64) — DISABLED
  # ============================================================================
  # The Windows binary build is temporarily commented out. The Windows `test`
  # job (matrix above) still builds and installs the wheel on Windows.
  #
  # build-windows:
  #   name: Build Windows (x86_64)
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - name: Set up Python
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: ${{ env.PYTHON_VERSION }}
  #
  #     - name: Build wheels
  #       uses: PyO3/maturin-action@v1
  #       with:
  #         args: --release --out dist
  #
  #     - name: Upload wheel
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: wheel-windows-x86_64
  #         path: dist/*.whl

  # ============================================================================
  # GitHub Release (tag-triggered)
  #
  # Pushing a `v*` tag (e.g. `v1.4.0`) builds the Linux/macOS wheels and
  # publishes them as a GitHub Release with auto-generated release notes.
  # ============================================================================
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux-x86, build-linux-aarch64, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
